[project]
name = "odsod-daemon"
version = "0.0.0"
description = "Ambient meeting recorder daemon"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Oscar Söderlund", email = "odsod@users.noreply.github.com" },
]
dependencies = [
    "dbus-fast>=5.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "pydantic>=2.14.4",
    "pyside6>=6.12.0",
    "typer>=0.29.2",
    "watchfiles>=1.3.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
bench = ["jiwer>=4.0.0"]

[project.scripts]
odsodctl = "odsod_daemon.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "looptime>=0.9",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/tests/**", "**/testdata/**"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = ["--import-mode=importlib", "--looptime"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "timing: measures real latency; runs without virtual time",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["docs", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["legacy"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_packages = ["odsod_daemon"]

[[tool.importlinter.contracts]]
name = "Tiers go one way: cli -> services -> components -> lib"
type = "layers"
layers = [
    "odsod_daemon.cli",
    "odsod_daemon.services",
    "odsod_daemon.components",
    "odsod_daemon.lib",
]
